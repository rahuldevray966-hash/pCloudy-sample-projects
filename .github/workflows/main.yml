import os
import time

from appium import webdriver
from appium.options.ios import XCUITestOptions


PCLOUDY_URL = "https://device.pcloudy.com/appiumcloud/wd/hub"

PCLOUDY_EMAIL = os.environ["PCLOUDY_EMAIL"]
PCLOUDY_ACCESS_KEY = os.environ["PCLOUDY_ACCESS_KEY"]

PCLOUDY_DEVICE = os.environ["PCLOUDY_DEVICE"]
PCLOUDY_APPLICATION_NAME = os.environ["PCLOUDY_APPLICATION_NAME"]

IOS_BUNDLE_ID = os.environ["IOS_BUNDLE_ID"]


def test_ios_appium():

    print("==========================================")
    print("Starting iOS Appium Automation")
    print("==========================================")

    print(f"Device : {PCLOUDY_DEVICE}")
    print(f"App    : {PCLOUDY_APPLICATION_NAME}")
    print(f"Bundle : {IOS_BUNDLE_ID}")

    options = XCUITestOptions()

    options.set_capability(
        "pCloudy_Username",
        PCLOUDY_EMAIL
    )

    options.set_capability(
        "pCloudy_ApiKey",
        PCLOUDY_ACCESS_KEY
    )

    options.set_capability(
        "pCloudy_ApplicationName",
        PCLOUDY_APPLICATION_NAME
    )

    options.set_capability(
        "pCloudy_DurationInMinutes",
        10
    )

    options.set_capability(
        "pCloudy_DeviceFullName",
        PCLOUDY_DEVICE
    )

    options.set_capability(
        "platformName",
        "iOS"
    )

    options.set_capability(
        "automationName",
        "XCUITest"
    )

    options.set_capability(
        "bundleId",
        IOS_BUNDLE_ID
    )

    options.set_capability(
        "newCommandTimeout",
        120
    )

    driver = None

    try:

        print("Connecting to pCloudy Appium...")

        driver = webdriver.Remote(
            PCLOUDY_URL,
            options=options
        )

        print("Appium session created successfully")

        print(f"Session ID: {driver.session_id}")

        time.sleep(5)

        print("Application launched successfully")

        page_source = driver.page_source

        if page_source:

            print("Page source received successfully")

        else:

            print("WARNING: Page source is empty")


        print("==========================================")
        print("iOS Appium Automation PASSED")
        print("==========================================")


    finally:

        if driver:

            print("Closing Appium session...")

            driver.quit()

            print("Appium session closed")
